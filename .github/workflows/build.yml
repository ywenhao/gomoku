name: build

# 为 nsh 支持的所有桌面与移动目标各打一个可安装包：Windows、Linux、
# Android、macOS，外加 Web 静态站点。这里只构建并上传 artifact，发布到
# Releases 由 release.yml 接手（见那个文件的说明）。

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths-ignore:
      - "**.md"
      - ".shots/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 关于 Node 版本：这个项目本身不跑 Node（没有 package.json，打包、类型检查、
# 测试全在 nsh 这一个二进制里，它自带 rolldown + oxc + QuickJS），所以不需要
# actions/setup-node。CI 里出现的 Node 是各个 action 自己的运行时 —— 早先
# actions/checkout@v4 之类声明的是 node20，GitHub 会强制在 node24 上跑并告警。
# 现在统一到声明 node24 的版本（node24 就是当前的 LTS）：
#   checkout v7 / cache v6 / upload-artifact v7 / download-artifact v8 /
#   setup-java v6 / action-gh-release v3
# 其中 upload-artifact 只有 v7 起、download-artifact 只有 v8 起才是 node24。
# 想连大版本一起钉死的话，把 tag 换成 commit SHA 即可。
#
# 关于 runner 镜像：三个系统都写死具体版本，不用 -latest，这样镜像换代不会
# 悄悄改变构建环境（ubuntu-latest 正要从 24.04 迁到 26.04，Android SDK 的
# 路径和预装组件都可能跟着变）。要升级时改下面这几行即可：
#   ubuntu-24.04 → ubuntu-26.04（LTS 对 LTS）
#   windows-2025 → windows-2026
#   macos-26 → macos-27（必须仍指向 arm64 那份）

env:
  NSH_VERSION: v0.2.0

jobs:
  check:
    name: 类型检查与测试
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nsh
        with:
          version: ${{ env.NSH_VERSION }}
      - name: 类型检查
        run: nsh check
      - name: 测试
        run: nsh test

  windows:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nsh
        with:
          version: ${{ env.NSH_VERSION }}
      - name: 打包
        shell: bash
        run: |
          set -euo pipefail
          # 产出 <out>/<name>/ 与 <out>/<name>.zip，zip 里是 <name>.exe 加旁边的 nsh/。
          nsh package --target windows -o dist/windows
          mv dist/windows/*.zip dist/windows/gomoku-windows-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: gomoku-windows-x64
          path: dist/windows/gomoku-windows-x64.zip
          if-no-files-found: error

  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nsh
        with:
          version: ${{ env.NSH_VERSION }}
      - name: 打包
        shell: bash
        run: |
          set -euo pipefail
          # 产出 <out>/<name>/（GTK runner + nsh/ + .desktop）和同名 .tar.gz。
          # 运行需要 GTK 4.14+，即 Ubuntu 24.04 及以上。
          nsh package --target linux -o dist/linux
          mv dist/linux/*.tar.gz dist/linux/gomoku-linux-x64.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: gomoku-linux-x64
          path: dist/linux/gomoku-linux-x64.tar.gz
          if-no-files-found: error

  macos:
    name: macOS arm64
    # nsh 只发 arm64 的 macOS 包（没有 Intel 版），所以必须是 Apple Silicon
    # 的 runner：macos-26 指向的就是 arm64 那份（Intel 那份叫 macos-26-intel）。
    # 万一哪天标签变了，下面的 uname 断言会直接报出来。
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nsh
        with:
          version: ${{ env.NSH_VERSION }}
      - name: 打包
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64 || {
            echo "nsh 没有 Intel macOS 版，请换 arm64 runner" >&2
            exit 1
          }
          # 产出 ad hoc 签名的 .app；codesign 与 sips 由 Xcode 命令行工具提供。
          nsh package --target macos -o dist/macos
          # 用 ditto 而不是 zip：它保留 bundle 里的软链和权限位。
          ditto -c -k --keepParent "dist/macos/五子棋.app" dist/macos/gomoku-macos-arm64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: gomoku-macos-arm64
          path: dist/macos/gomoku-macos-arm64.zip
          if-no-files-found: error

  android:
    name: Android
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nsh
        with:
          version: ${{ env.NSH_VERSION }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: 安装 Android SDK 组件
        shell: bash
        run: |
          set -euo pipefail
          # nsh 要用 build-tools 里的 aapt2、zipalign、apksigner，以及
          # platforms/android-35/android.jar。runner 镜像里本来就有，
          # 这里显式装一遍，免得哪天镜像更新把它们去掉。
          sdkmanager="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - name: 打包
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            # 上架用：仓库配好这三个 secret 就走正式签名。
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            nsh package --target android -o dist/android \
              --keystore "$RUNNER_TEMP/release.jks" \
              --key-alias "$KEY_ALIAS" \
              --keystore-password "$KEYSTORE_PASSWORD"
          else
            # 没配 keystore 时 nsh 用标准 debug key 签名：能装到任何设备上试玩，
            # 但上不了应用商店。
            nsh package --target android -o dist/android
          fi
          mv dist/android/*.apk dist/android/gomoku-android.apk
      - uses: actions/upload-artifact@v7
        with:
          name: gomoku-android
          path: dist/android/gomoku-android.apk
          if-no-files-found: error

  web:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nsh
        with:
          version: ${{ env.NSH_VERSION }}
      - name: 打包
        shell: bash
        run: |
          set -euo pipefail
          # 静态站点：index.html 加内容哈希命名的 wasm/js/字节码，丢给任意
          # 服务器或 CDN 即可。需要 http 协议，直接双击 index.html 打不开。
          nsh package --target web -o dist/web
          cd dist/web
          # 用 ./* 而不是 .：zip 还没建出来，通配符展开时不会把压缩包自己圈进去，
          # 解压后也是一个完整的「五子棋/」目录。
          zip -qr gomoku-web.zip ./*
      - uses: actions/upload-artifact@v7
        with:
          name: gomoku-web
          path: dist/web/gomoku-web.zip
          if-no-files-found: error
